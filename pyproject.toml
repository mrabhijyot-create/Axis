[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-axis"
version = "0.1.0"
description = "IPL match prediction & analytics dashboard powered by Claude Opus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy>=2.0",
  "pandas>=2.1",
  "httpx>=0.27",
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "apscheduler>=3.10",
  "streamlit>=1.32",
  "plotly>=5.20",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "freezegun>=1.4",
  "ruff>=0.4",
]

[project.scripts]
ipl-init-db = "ipl.db.session:cli_init"
ipl-load-cricsheet = "ipl.etl.cricsheet:cli_load"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
